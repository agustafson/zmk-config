<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="915" height="450" viewBox="0 0 915 450" class="keymap">
<ns0:rect width="100%" height="100%" fill="#f4f6fa" /><ns0:style>/* inherit to force styles through use tags */
svg path {
    fill: inherit;
}

/* font and background color specifications */
svg.keymap {
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    font-size: 14px;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
    fill: #24292e;
}

/* default key styling */
rect.key {
    fill: #f6f8fa;
}

rect.key, rect.combo {
    stroke: #c9cccf;
    stroke-width: 1;
}

/* default key side styling, only used is draw_key_sides is set */
rect.side {
    filter: brightness(90%);
}

/* color accent for combo boxes */
rect.combo, rect.combo-separate {
    fill: #cdf;
}

/* color accent for held keys */
rect.held, rect.combo.held {
    fill: #fdd;
}

/* color accent for ghost (optional) keys */
rect.ghost, rect.combo.ghost {
    stroke-dasharray: 4, 4;
    stroke-width: 2;
}

text {
    text-anchor: middle;
    dominant-baseline: middle;
}

/* styling for layer labels */
text.label {
    font-weight: bold;
    text-anchor: start;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for optional footer */
text.footer {
    text-anchor: end;
    dominant-baseline: auto;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for combo tap, and key non-tap label text */
text.combo, text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br {
    font-size: 11px;
}

text.hold, text.bl, text.br {
    text-anchor: middle;
    dominant-baseline: auto;
}

text.shifted, text.tl, text.tr {
    text-anchor: middle;
    dominant-baseline: hanging;
}

text.left, text.tl, text.bl {
    text-anchor: start;
}

text.right, text.tr, text.br {
    text-anchor: end;
}

text.layer-activator {
    text-decoration: underline;
}

/* styling for hold/shifted label text in combo box */
text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
    font-size: 8px;
}

/* lighter symbol for transparent keys */
text.trans {
    fill: #7b7e81;
}

/* styling for combo dendrons */
path.combo {
    stroke-width: 1;
    stroke: gray;
    fill: none;
}

/* Start Tabler Icons Cleanup */
/* cannot use height/width with glyphs */
.icon-tabler &gt; path {
    fill: inherit;
    stroke: inherit;
    stroke-width: 2;
}
/* hide tabler's default box */
.icon-tabler &gt; path[stroke="none"][fill="none"] {
    visibility: hidden;
}
/* End Tabler Icons Cleanup */

svg.keymap { background-color: #f4f6fa; font-family: DejaVu Sans, sans-serif; font-size: 14px; fill: #18253c; }
rect.key { fill: #ffffff; stroke: #c6d0df; stroke-width: 1; }
text.label { font-size: 19px; font-weight: 700; fill: #18253c; }
text.hold { fill: #23699a; font-size: 10px; }
text.shifted { fill: #927031; font-size: 10px; }
text.footer { fill: #596b83; font-size: 12px; }
rect.combo { fill: #123756; stroke: #123756; }
text.combo { fill: #ffffff; font-size: 13px; }
text.combo.hold, text.combo.shifted { fill: #dceaf6; font-size: 8px; }
rect.held { fill: #bce5db; stroke: #429a87; }
rect.ghost { fill: #e8edf4; stroke: #d0d9e5; }
text.ghost { fill: #77869a; }
path.combo { stroke: #759cb7; stroke-width: 1.5; fill: none; }

text.label, text.footer { stroke: none; }
</ns0:style>
