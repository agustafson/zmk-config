parse_config:
  zmk_additional_includes:
  - draw/include
  raw_binding_map:
    '&kp LC(LA(LS(LGUI)))':
      t: Hyper
      h: 4 mods
    '&kp LC(LA(LSHFT))':
      t: Meh
      h: 3 mods
    '&smart_mouse': Mouse
    '&leader': Leader
    '&leader_sft': Shift+Leader
    '&sys_reset': Reset
    '&bootloader': Boot
    '&caps_word': Caps Word
    '&kp LG(C)': Copy
    '&kp LG(V)': Paste
    '&kp LG(X)': Cut
    '&kp LG(Z)': Undo
    '&direct_fence': Fence
    '&kp LG(W)': Close
    '&kp LG(LS(TAB))': Prev App
    '&swapper': Next App
    '&kp LC(LEFT)': Prev Space
    '&kp LC(RIGHT)': Next Space
    '&kp LC(UP)': Mission Ctrl
    '&kp LG(SPACE)': Spotlight
    '&kp LG(GRAVE)': Next Window
    '&mt_home':
      t: Left
      h: Line start
    '&mt_end':
      t: Right
      h: Line end
    '&mt LG(UP) UP':
      t: Up
      h: Doc start
    '&mt LG(DOWN) DOWN':
      t: Down
      h: Doc end
    '&mt LA(BSPC) BSPC':
      t: Bspc
      h: Del word
    '&mt LA(DEL) DEL':
      t: Del
      h: Del word
    '&kp LA(LEFT)': Prev Word
    '&kp LA(RIGHT)': Next Word
    '&lt_spc':
      t: Space
      h: Nav
      s: Sentence
    '&smart_num':
      t: Numword
      h: Num
    '&magic_shift':
      t: Magic
      h: Shift
      s: Caps Word
    '&mmv MOVE_UP': Mouse Up
    '&mmv MOVE_DOWN': Mouse Down
    '&mmv MOVE_LEFT': Mouse Left
    '&mmv MOVE_RIGHT': Mouse Right
    '&msc SCRL_UP': Scroll Up
    '&msc SCRL_DOWN': Scroll Down
    '&msc SCRL_LEFT': Scroll Left
    '&msc SCRL_RIGHT': Scroll Right
    '&mkp LCLK': Click 1
    '&mkp RCLK': Click 2
    '&mkp MCLK': Click 3
    '&mkp MB4': Click 4
    '&mkp MB5': Click 5
    '&hm_combo_tab':
      t: Tab
      h: Shift+Opt
    '&hm_combo_shift_cmd':
      h: Shift+Cmd
    '&hm_combo_equal':
      t: '='
      h: Opt+Cmd
    '&hm_combo_shift_opt_cmd':
      h: S+Opt+Cmd
    '&hm_combo_prcnt':
      t: '%'
      h: Ctrl+Opt
    '&hm_combo_lpar':
      t: (
      h: Shift+Cmd
      s: <
    '&hm_combo_rpar':
      t: )
      h: Shift+Opt
      s: '>'
    '&hm_combo_minus':
      t: '-'
      h: Cmd+Opt
    '&hm_combo_under':
      t: _
      h: S+Opt+Cmd
    '&hm_combo_caret':
      t: ^
      h: Opt+Ctrl
  trans_legend:
    t: ''
    type: trans
  zmk_keycode_map:
